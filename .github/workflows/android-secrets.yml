#############################################################################
#                    🔎 Éprouver les secrets Android                        #
#############################################################################
#
# Ne construit rien : décode le keystore, l'ouvre, y trouve la clé, affiche
# l'empreinte du certificat. Une vingtaine de secondes.
#
# Existe parce que la boucle de correction était absurde : un secret mal
# recollé ne se voyait qu'en lançant « Release Desktop App », qui vérifie
# d'abord tout le code puis construit trois installeurs de bureau — plusieurs
# minutes, pour finir sur une ligne d'erreur qu'on aurait pu obtenir tout de
# suite. Et un secret GitHub ne se relit pas : sans ce lancement, il n'existe
# aucun moyen de savoir ce qu'il contient.
#
# Les contrôles eux-mêmes vivent dans scripts/check-android-keystore.sh, le
# même fichier qu'exécute le job `android-build` avant de compiler : ce qui
# passe ici passera là-bas.

name: Éprouver les secrets Android

on:
  workflow_dispatch: {}

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uniquement pour `keytool`, qui vient avec le JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier le keystore et ses mots de passe
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/check-android-keystore.sh
