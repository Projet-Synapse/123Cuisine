name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Garde-fou : rien n'est publié tant que ceci n'est pas vert.
  #
  # Existe à cause de la 1.2.4, partie en production avec une configuration
  # Supabase pointant sur un backend mort : connexion impossible, alors que
  # tsc, eslint et le bundle web passaient tous. D'où l'ordre des contrôles —
  # la configuration D'ABORD (contrôle hors ligne + le serveur répond
  # vraiment), puis les types, puis le lint, puis l'export web complet.
  #
  # `needs: verify` sur les deux autres jobs : un échec ici et aucun
  # installeur n'est construit, aucune release GitHub n'est créée.
  # ─────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configuration Supabase (hors ligne + service joignable)
        run: node scripts/check-supabase-env.mjs --live

      - name: Types TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm run lint

      - name: Export web
        run: pnpm run build:web

      # Contrôle né d'une vraie panne : entre les versions 1.2.4 et 1.2.6, le
      # motif `!node_modules/**/*` d'electron-builder attrapait aussi
      # `dist/assets/node_modules/…`, où Expo dépose les polices. Les
      # installeurs partaient sans une seule police : toutes les icônes
      # s'affichaient en carrés vides sur le bureau. Rien ne le signalait —
      # ni tsc, ni ESLint, ni l'export web, qui n'est pas empaqueté.
      # On empaquette donc pour de vrai et on compte les polices.
      - name: Les polices survivent à l'empaquetage
        run: |
          npx electron-builder --linux dir --publish never -c.directories.output=/tmp/pkgcheck
          COUNT=$(npx asar list /tmp/pkgcheck/linux-unpacked/resources/app.asar | grep -ci '\.ttf$' || true)
          echo "Polices trouvées dans app.asar : $COUNT"
          if [ "$COUNT" -lt 18 ]; then
            echo "::error::app.asar ne contient que $COUNT police(s). Les icônes s'afficheraient en carrés vides. Vérifier le bloc 'files' d'electron-builder.yml — 'dist/**/*' doit venir APRÈS '!node_modules/**/*'."
            exit 1
          fi

  release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:web

      # `always` sur un tag, `never` sinon : sans ce garde-fou, un simple
      # lancement manuel depuis une branche publierait une release GitHub pour
      # la version en cours — et electron-updater la proposerait aussitôt à
      # tout le monde. Le lancement manuel doit rester un essai à blanc : il
      # construit tout, il ne publie rien.
      - run: npx electron-builder --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # APK Android.
  #
  # Trois jobs plutôt qu'un seul, pour des raisons vécues :
  #
  #  · `android-build` ne dépend QUE de `verify`, jamais de `release` : un
  #    échec du build macOS ou Windows ne doit pas priver du téléphone.
  #  · `android-eas` ne se déclenche QUE si le build Gradle échoue, et se
  #    saute proprement si le compte Expo n'est pas branché — un filet, pas
  #    une dépendance.
  #  · `android-publish` attend `release`, parce que c'est electron-builder
  #    qui crée la release GitHub : y joindre l'APK avant qu'elle existe
  #    échouerait. La CONSTRUCTION de l'APK, elle, reste indépendante.
  #
  # L'APK est toujours déposé en artefact du workflow, y compris hors tag :
  # c'est ce qui rend le lancement manuel utile pour tester avant de publier.
  # ─────────────────────────────────────────────────────────────
  android-build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Le bundle Metro de production tient mal dans la mémoire Node par
      # défaut sur un runner : Skia, WebRTC et Maps font un gros graphe.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # React Native 0.79 / AGP ne fonctionnent qu'avec un JDK 17. Le JDK par
      # défaut du runner est plus récent et fait échouer Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      # Sans keystore, `assembleRelease` produirait un APK signé avec la clé
      # de DÉBOGAGE du gabarit React Native : installable, mais impossible à
      # mettre à jour proprement ensuite. On préfère un échec visible.
      #
      # Et on l'éprouve ICI, en trois secondes, plutôt que de laisser Gradle
      # échouer au bout d'une demi-heure sur un message illisible : les quatre
      # secrets sont opaques (ils ne se relisent pas depuis GitHub), donc une
      # faute de copier-coller ne se voit nulle part ailleurs.
      - name: Restaurer et vérifier le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          ERR="$RUNNER_TEMP/keytool.err"

          # Un secret collé depuis un terminal traîne presque toujours une
          # espace ou un retour à la ligne invisible — et l'interface GitHub ne
          # permet pas de relire un secret pour s'en apercevoir. On élague donc
          # les extrémités, mais seulement APRÈS avoir essayé la valeur telle
          # quelle : un mot de passe a le droit de commencer par une espace.
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          if [ -z "$(trim "$KEYSTORE_BASE64")" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent — impossible de signer l'APK. Marche à suivre : .github/ANDROID.md"
            exit 1
          fi

          # Ici on retire TOUS les blancs, pas seulement ceux des extrémités :
          # `base64` sans `-w0` découpe sa sortie en lignes de 76 caractères.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ne contient pas du base64 valide. Y coller la sortie de : base64 -w0 123cuisine-release.jks"
            exit 1
          fi

          # Le mot de passe du magasin, essayé brut puis élagué.
          # `> "$ERR" 2>&1` et pas `2> "$ERR"` : keytool écrit ses erreurs sur
          # la sortie STANDARD, pas sur la sortie d'erreur. Les envoyer vers
          # /dev/null rendait le diagnostic ci-dessous toujours faux.
          PW="$KEYSTORE_PASSWORD"
          if ! keytool -list -keystore "$KS" -storepass "$PW" > "$ERR" 2>&1; then
            PW_TRIMMED="$(trim "$KEYSTORE_PASSWORD")"
            if [ "$PW_TRIMMED" != "$KEYSTORE_PASSWORD" ] && keytool -list -keystore "$KS" -storepass "$PW_TRIMMED" > /dev/null 2>&1; then
              # `add-mask` avant toute utilisation : la variante élaguée n'est
              # pas le secret enregistré, GitHub ne la masquerait pas d'office.
              echo "::add-mask::$PW_TRIMMED"
              echo "::warning::Le secret ANDROID_KEYSTORE_PASSWORD contient une espace ou un retour à la ligne parasite ; il est élagué automatiquement, mais mieux vaut le recoller proprement."
              PW="$PW_TRIMMED"
            elif grep -qi 'password was incorrect\|tampered with' "$ERR"; then
              echo "::error::Le fichier est bien un keystore, mais ANDROID_KEYSTORE_PASSWORD ne l'ouvre pas. C'est CE secret-là qu'il faut corriger — le base64 est bon."
              exit 1
            else
              echo "::error::Le contenu de ANDROID_KEYSTORE_BASE64 n'est pas un keystore. Ce n'est pas un problème de mot de passe : c'est le fichier encodé qui n'est pas le bon."
              sed -n '1,3p' "$ERR"
              exit 1
            fi
          fi

          # L'alias : celui du secret s'il désigne vraiment une clé, sinon
          # celui que porte le keystore. Il n'y a qu'une clé là-dedans, et
          # cette information est DANS le fichier : en dépendre plutôt que
          # d'un copier-coller supprime purement et simplement une cause de
          # panne, sans rien deviner.
          ALIAS="$(trim "$KEY_ALIAS")"
          if [ -z "$ALIAS" ] || ! keytool -list -keystore "$KS" -storepass "$PW" -alias "$ALIAS" > /dev/null 2>&1; then
            DETECTED="$(keytool -list -keystore "$KS" -storepass "$PW" 2>/dev/null | awk -F', ' '/PrivateKeyEntry/ { print $1; exit }')"
            if [ -z "$DETECTED" ]; then
              echo "::error::Le keystore s'ouvre mais ne contient aucune clé privée — impossible de signer quoi que ce soit avec."
              exit 1
            fi
            if [ -n "$ALIAS" ]; then
              echo "::warning::Le secret ANDROID_KEY_ALIAS ne désigne aucune clé de ce keystore ; l'alias réellement présent est utilisé à sa place. Le build continue, mais ce secret mérite d'être corrigé (ou supprimé, il est facultatif)."
            fi
            ALIAS="$DETECTED"
          fi
          echo "::add-mask::$ALIAS"

          # Le mot de passe de la clé. Le keystore est au format PKCS12, où il
          # est forcément identique à celui du magasin : le secret est donc
          # facultatif, et une valeur différente ne peut être qu'une erreur —
          # Gradle échouerait dessus bien plus tard, sans rien dire d'utile.
          KEY_PW="$(trim "$KEY_PASSWORD")"
          if [ -z "$KEY_PW" ]; then
            KEY_PW="$PW"
          elif [ "$KEY_PW" != "$PW" ]; then
            echo "::error::ANDROID_KEY_PASSWORD diffère de ANDROID_KEYSTORE_PASSWORD. Le keystore est au format PKCS12 : les deux doivent être identiques (ou ANDROID_KEY_PASSWORD supprimé, il est facultatif)."
            exit 1
          fi
          echo "::add-mask::$KEY_PW"

          # Empreinte du certificat : à comparer avec celle du keystore local
          # (keytool -list -v). Elle n'a rien de secret, elle voyage dans
          # chaque APK — c'est justement ce qui permet de confirmer que la CI
          # signe bien avec LA bonne clé.
          echo "Keystore accepté. Empreinte du certificat :"
          keytool -list -keystore "$KS" -storepass "$PW" -alias "$ALIAS" -v | grep -i 'SHA256:' || true

          # Les valeurs assainies prennent le relais des secrets bruts pour
          # toute la suite du job (prebuild et Gradle). Les étapes suivantes ne
          # doivent donc PAS redéclarer ces variables dans leur bloc `env:`,
          # sinon les valeurs non élaguées reviendraient par la fenêtre.
          {
            echo "ANDROID_KEYSTORE_PATH=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      # Le dossier android/ n'est pas dans le dépôt : il est régénéré ici à
      # partir d'app.config.js (dont le plugin de signature, qui s'active
      # grâce aux variables ANDROID_KEYSTORE_* ci-dessous).
      - name: Générer le projet Android
        run: |
          npx expo prebuild --platform android --no-install --clean
          # Le gabarit plafonne le démon Gradle à 2 Go, trop juste pour
          # compiler le natif de Skia/Reanimated en release. La dernière
          # ligne d'un fichier .properties l'emporte sur les précédentes.
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          # Contrôle : le plugin a-t-il bien fait son travail ? Un APK signé
          # avec la clé de débogage doit être détecté ICI, pas sur le
          # téléphone.
          if ! grep -q 'signingConfigs.release' android/app/build.gradle; then
            echo "::error::plugins/with-android-signing.js n'a pas modifié build.gradle — l'APK serait signé avec la clé de débogage."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      # On n'embarque que les deux architectures des vrais téléphones : les
      # variantes x86 ne servent qu'aux émulateurs et doubleraient le temps
      # de compilation comme la taille du fichier.
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      # Même esprit que le comptage de polices plus haut : on inspecte le
      # produit fini au lieu de faire confiance à la configuration.
      - name: Vérifier la signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk 123Cuisine.apk
          ls -lh 123Cuisine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 123Cuisine-apk
          path: 123Cuisine.apk
          if-no-files-found: error

  # Filet de secours : EAS Build (serveurs d'Expo), uniquement si la
  # compilation Gradle a échoué ET que le compte Expo est configuré.
  android-eas:
    needs: [verify, android-build]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.android-build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vérifier la configuration Expo
        id: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN ou EAS_PROJECT_ID absent — secours EAS ignoré."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'APK sur EAS
        if: steps.expo.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json
          BUILD_URL=$(node -e "const b=require('./eas-build.json');const e=Array.isArray(b)?b[0]:b;if(!e?.artifacts?.buildUrl){console.error('URL de build introuvable dans la réponse EAS');process.exit(1)}console.log(e.artifacts.buildUrl)")
          curl -fL "$BUILD_URL" -o 123Cuisine.apk
          ls -lh 123Cuisine.apk

      - name: Joindre l'APK à la release
        if: steps.expo.outputs.ready == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" 123Cuisine.apk --clobber

  # Attend que la release GitHub existe (c'est `release` qui la crée) avant
  # d'y joindre l'APK déjà construit.
  android-publish:
    needs: [android-build, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 123Cuisine-apk

      - name: Joindre l'APK à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ce job ne fait pas de checkout (il n'a besoin que de l'artefact) :
          # sans GH_REPO, la commande `gh` ne saurait pas de quel dépôt il
          # s'agit puisqu'il n'y a aucun dossier git autour d'elle.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" 123Cuisine.apk --clobber
