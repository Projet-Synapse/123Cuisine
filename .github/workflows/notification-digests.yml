name: Notification Digests

# Déclenche la fonction Edge send-notification-digests toutes les heures —
# c'est elle qui décide qui est réellement "dû" selon sa récurrence
# (heure/jour/semaine/mois/an), cf. supabase/functions/send-notification-digests.
# Limite connue : les workflows planifiés GitHub sont "best effort" (quelques
# minutes de retard possibles) et sont désactivés après 60 jours sans activité
# sur le dépôt.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vérifie .env avant d'appeler quoi que ce soit. Sans cette étape, une
      # URL qui ne pointe plus sur le bon projet donne un « curl: (22) 500 »
      # illisible qui se répète toutes les heures — c'est exactement ce qui
      # s'est produit entre le 21/08 19h18 UTC et la correction.
      - name: Vérifie la configuration Supabase
        run: node scripts/check-supabase-env.mjs

      - name: Appelle la fonction Edge send-notification-digests
        run: |
          set -a
          source .env
          set +a
          HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "$EXPO_PUBLIC_SUPABASE_URL/functions/v1/send-notification-digests")
          echo "HTTP $HTTP_CODE"
          cat response.txt
          echo
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::La fonction Edge a répondu $HTTP_CODE. Journal détaillé : tableau de bord Supabase → Edge Functions → send-notification-digests → Logs."
            exit 1
          fi
