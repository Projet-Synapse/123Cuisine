name: Vérification

# Workflow réutilisable appelé par release.yml et pr.yml.
on:
  workflow_call: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configuration Supabase (hors ligne + service joignable)
        run: node scripts/check-supabase-env.mjs --live
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: pnpm run lint
      - name: Export web
        run: pnpm run build:web
      - name: Les polices survivent à l'empaquetage
        run: |
          npx electron-builder --linux dir --publish never -c.directories.output=/tmp/pkgcheck
          COUNT=$(npx asar list /tmp/pkgcheck/linux-unpacked/resources/app.asar | grep -ci '\.ttf$' || true)
          echo "Polices trouvées dans app.asar : $COUNT"
          if [ "$COUNT" -lt 18 ]; then
            echo "::error::app.asar ne contient que $COUNT police(s)."
            exit 1
          fi
