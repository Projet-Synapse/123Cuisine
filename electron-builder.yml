appId: com.macuisine.app
productName: MaCuisine
directories:
  output: dist_electron
publish:
  provider: github
  owner: catelyn2332-design
  repo: 123Cuisinez
  releaseType: release
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraMetadata:
  main: electron/main.js
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: assets/images/logo.png
  category: public.app-category.food-and-drink
win:
  target: nsis
  icon: assets/images/logo.png
linux:
  target: AppImage
  icon: assets/images/logo.png
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
