appId: com.cuisine123.app
productName: 123Cuisine
directories:
  output: dist_electron
# Nom des fichiers publiés sur la release GitHub, sans le numéro de version —
# sur demande explicite, pour vérifier si la confusion de nom entre fichiers
# jouait un rôle dans les soucis d'installation constatés. Les manifestes
# latest*.yml qu'electron-updater va chercher gardent leur nom fixe, non
# concerné par ce réglage.
#
# IMPORTANT : le moteur de template d'electron-builder ne supporte QUE des
# macros ${xxx} littérales (productName, version, arch, ext...), pas
# d'expressions JS/ternaires à l'intérieur — une première tentative avec un
# ternaire (`${ arch !== "x64" ? ... : ... }`) a produit des noms de
# fichiers corrompus ET fait planter makensis.exe côté Windows
# (ERR_ELECTRON_BUILDER_CANNOT_EXECUTE), cf. release v1.2.1 avortée. D'où
# la config par plateforme ci-dessous plutôt qu'un seul gabarit générique :
# win/linux n'ont qu'une seule architecture (pas besoin de ${arch}), mac en
# a deux (x64 + arm64) et DOIT le garder pour ne pas faire collisionner les
# deux variantes.
publish:
  provider: github
  owner: catelyn2332-design
  # Le dépôt GitHub a été renommé 123Cuisinez -> 123Cuisine (cohérent avec le
  # renommage de l'app). GitHub redirige automatiquement l'ancien nom, mais
  # autant pointer directement sur le nouveau.
  repo: 123Cuisine
  releaseType: release
# Nom affiché du release GitHub (le titre, séparé du tag/de la version) : on
# le fixe volontairement pour que chaque release s'appelle juste "123Cuisine",
# sans le numéro de version dans le titre.
releaseInfo:
  releaseName: 123Cuisine
files:
  - electron/**/*
  - dist/**/*
  - package.json
extraMetadata:
  main: electron/main.js
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: assets/images/logo.png
  category: public.app-category.food-and-drink
  artifactName: '${productName}-${arch}.${ext}'
win:
  target: nsis
  icon: assets/images/logo.png
  artifactName: '${productName}.${ext}'
linux:
  target: AppImage
  icon: assets/images/logo.png
  category: Utility
  artifactName: '${productName}.${ext}'
nsis:
  # oneClick: false (assistant avec choix du dossier d'installation) affiche
  # l'installeur NSIS complet à CHAQUE lancement — y compris celui déclenché
  # silencieusement par electron-updater lors d'une mise à jour automatique.
  # C'est ce qui donnait l'impression d'un désinstall/réinstall complet (et
  # provoquait une erreur) au lieu d'une mise à jour transparente. oneClick
  # (installation silencieuse, sans assistant) est la configuration que
  # electron-updater attend pour mettre à jour une app en place sans aucune
  # interaction ni fenêtre d'installateur visible.
  oneClick: true
  perMachine: false
  runAfterFinish: true
